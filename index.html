<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>きねんしゃしん</title>
<style>
  :root { --bg: #fff8ee; --card: #ffffff; --fg: #4a3b33; --sub: #8a776b; --accent: #ff8a5c; --line: #f0e2d2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", system-ui, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-size: 22px; margin: 8px 0 0; text-align: center; }
  .note { color: var(--sub); font-size: 14px; text-align: center; line-height: 1.6; margin: 0; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 10px; }
  .card h2 { font-size: 16px; margin: 0; }
  img, video { width: 100%; height: auto; border-radius: 12px; display: block; background: #eee; }
  .btn { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: bold;
         padding: 12px; border-radius: 999px; font-size: 16px; }
  .wait { text-align: center; color: var(--sub); padding: 18px 0; }
  .msg { text-align: center; padding: 40px 8px; line-height: 1.8; }
</style>
</head>
<body>
<main id="app">
  <h1>きねんしゃしん</h1>
  <p class="msg" id="status">よみこみ中…</p>
</main>
<script>
// VR レーシング（学園祭）の記念撮影を見るだけのページ。写真・動画はこのページには入っていない。
// URL の # のあと（サーバーには送られない）に、今の人の一覧（期限つきの URL）が入っている。
(function () {
  var app = document.getElementById('app');
  var status = document.getElementById('status');
  var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  function okUrl(u) {
    try { var x = new URL(u); return x.protocol === 'https:' && /\.supabase\.co$/.test(x.hostname) && x.pathname.indexOf('/storage/v1/object/sign/') === 0; }
    catch (e) { return false; }
  }
  if (!okUrl(raw)) { status.textContent = 'このページは、モニターの QR コードから ひらいてね。'; return; }
  var shown = {}; var tries = 0; var waitEl = null;

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    return e;
  }
  function add(item) {
    if (!okUrl(item.url) || (item.download && !okUrl(item.download))) return;
    var key = item.type + item.url; if (shown[key]) return; shown[key] = true;
    var card = el('section', { 'class': 'card' });
    card.appendChild(el('h2', {}, item.label || ''));
    if (item.type === 'video') {
      card.appendChild(el('video', { src: item.url, controls: '', playsinline: '', preload: 'metadata' }));
      if (item.download) card.appendChild(el('a', { 'class': 'btn', href: item.download }, 'どうがを ダウンロード'));
    } else {
      card.appendChild(el('img', { src: item.url, alt: item.label || 'しゃしん' }));
      card.appendChild(el('p', { 'class': 'note' }, 'しゃしんを ながおしで ほぞん'));
    }
    if (waitEl) app.insertBefore(card, waitEl); else app.appendChild(card);
  }
  function load() {
    fetch(raw, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('status ' + r.status);
      return r.json();
    }).then(function (m) {
      if (status) { status.remove(); status = null; app.appendChild(el('p', { 'class': 'note' }, '30分たつと 見られなくなります。はやめに ほぞんしてね。')); }
      (m.items || []).forEach(add);
      if (m.videoPending && tries < 120) {
        if (!waitEl) { waitEl = el('p', { 'class': 'wait' }, 'どうがは じゅんびちゅう…（このまま まってね）'); app.appendChild(waitEl); }
        tries++; setTimeout(load, 5000);
      } else if (waitEl) { waitEl.remove(); waitEl = null; }
    }).catch(function () {
      if (status) status.textContent = '見られる時間（30分）が おわったか、まだ じゅんびちゅうです。';
      else if (tries < 120) { tries++; setTimeout(load, 5000); }
    });
  }
  load();
})();
</script>
</body>
</html>
